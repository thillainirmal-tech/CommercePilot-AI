<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommercePilot AI</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f0ff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:64px 24px}.tag{color:#6ee7c7;letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(42px,7vw,82px);line-height:.95;margin:14px 0;background:linear-gradient(90deg,#fff,#64d8ff);-webkit-background-clip:text;color:transparent}.lead{color:#9fb2cb;max-width:700px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px}.card{background:#0e1c2e;border:1px solid #203957;border-radius:18px;padding:22px}button{background:#6ee7c7;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.step{border-left:3px solid #64d8ff;padding:8px 14px;margin:10px 0;color:#bdd0e7}.status{font-size:30px;font-weight:800;color:#6ee7c7}pre{white-space:pre-wrap;color:#a8bdd5}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="tag">Agentic commerce control plane</div><h1>Plan orders.<br>Keep humans in control.</h1><p class="lead">Four explainable agents coordinate inventory, risk, pricing and fulfillment while every external action remains behind an approval boundary.</p><button id="run">Run safe order demo →</button><section class="grid"><article class="card"><div class="tag">Decision</div><div class="status" id="status">READY</div><pre id="summary">No action executed.</pre></article><article class="card"><div class="tag">Agent trace</div><div id="trace"><p class="lead">Run the demo to inspect evidence.</p></div></article></section></main><script>run.onclick=async()=>{status.textContent='PLANNING';let d=await fetch('/api/orders/demo').then(r=>r.json());status.textContent=d.status;summary.textContent=`Order ${d.orderId}\nTotal: ${d.total}\nRisk: ${d.riskScore}/100\n\n${d.safetyBoundary}`;trace.innerHTML=d.trace.map(s=>`<div class="step"><b>${s.agent}</b> · ${s.outcome}<br>${s.evidence}</div>`).join('')}</script></body></html>
